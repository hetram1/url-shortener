services:
  postgres:
    image: postgres:17-alpine
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_user
      POSTGRES_PASSWORD: url_password
    ports:
      - "5433:5432"
    volumes:
      - url_shortener_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_user -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  url_shortener_postgres_data:
